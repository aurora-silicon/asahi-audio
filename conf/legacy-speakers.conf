# SPDX-License-Identifier: MIT
# Opt-in legacy speaker graphs for J316, J413, J616 and J700.
#
# On these Macs speakerguardd v2 builds and owns the speaker path, so the tree
# default (99-asahi.conf) installs no speaker graph for them. A distribution
# that still ships speakersafetyd instead of speakerguardd v2 installs this
# fragment with `make install-legacy-speakers`, which puts the four graphs back.
# Never install it next to speakerguardd v2: both would claim the speaker PCM.
#
# WirePlumber appends the rules below to node.software-dsp.rules in 99-asahi.conf.

node.software-dsp.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ413,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j413/graph.json"
                hide-parent = true
            }
        }
    }
    {
        matches = [
            { api.alsa.path = "hw:AppleJ316,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j316/graph.json"
                hide-parent = true
            }
        }
    }
    {
        matches = [
            { api.alsa.path = "hw:AppleJ616,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j616/graph.json"
                hide-parent = true
            }
        }
    }
    {
        matches = [
            { api.alsa.path = "hw:AppleJ700,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j700/graph.json"
                hide-parent = true
            }
        }
    }
]
