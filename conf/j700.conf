{
    "monitor.alsa.rules": [
        {
            "matches": [
                {
                    "alsa.id": "AppleJ700"
                }
            ],
            "actions": {
                "update-props": {
                    "api.alsa.use-ucm": true,
                    "device.routes.default-sink-volume": 0.00316227766,
                    "device.routes.default-source-volume": 1.0
                }
            }
        },
        {
            "matches": [
                {
                    "alsa.id": "AppleJ700LPAI"
                }
            ],
            "actions": {
                "update-props": {
                    "api.alsa.use-ucm": true,
                    "device.routes.default-source-volume": 1.0
                }
            }
        },
        {
            "matches": [
                {
                    "api.alsa.path": "hw:AppleJ700,0",
                    "media.class": "Audio/Sink"
                }
            ],
            "actions": {
                "update-props": {
                    "node.description": "MacBook Neo J700 Headphones",
                    "audio.format": "S24_32LE",
                    "audio.rate": 48000,
                    "audio.allowed-rates": [
                        48000
                    ],
                    "audio.channels": 2,
                    "audio.position": [
                        "FL",
                        "FR"
                    ]
                }
            }
        },
        {
            "matches": [
                {
                    "api.alsa.path": "hw:AppleJ700,0",
                    "media.class": "Audio/Source"
                }
            ],
            "actions": {
                "update-props": {
                    "node.description": "MacBook Neo J700 Headset Microphone",
                    "audio.format": "S24_32LE",
                    "audio.rate": 48000,
                    "audio.allowed-rates": [
                        48000
                    ],
                    "audio.channels": 1,
                    "audio.position": [
                        "MONO"
                    ],
                    "priority.session": 2100
                }
            }
        },
        {
            "matches": [
                {
                    "api.alsa.path": "hw:AppleJ700LPAI,0",
                    "media.class": "Audio/Source"
                }
            ],
            "actions": {
                "update-props": {
                    "node.description": "MacBook Neo J700 Internal Microphone",
                    "audio.format": "S32LE",
                    "audio.rate": 16000,
                    "audio.allowed-rates": [
                        16000
                    ],
                    "audio.channels": 2,
                    "audio.position": [
                        "FL",
                        "FR"
                    ],
                    "priority.session": 2000
                }
            }
        }
    ]
}
