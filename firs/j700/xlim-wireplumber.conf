# J700 (MacBook Neo): the speaker graph with the excursion limiter last
# (graph-xlim.json), for testing.  Not read from here: copy it to
#
#   ~/.config/wireplumber/wireplumber.conf.d/99-asahi-j700-xlim.conf
#
# and restart the user's WirePlumber and PipeWire (systemctl --user restart
# wireplumber pipewire).  It needs speakerguard-xlim.so on the LADSPA path
# (speakerguardd's filter/); without it the speaker graph fails to load and
# there is no speaker audio, never unprotected audio.  To go back, remove the
# copy and restart the same way.
#
# It replaces the whole software-DSP rule list with the J700's two rules,
# the stock microphone rule unchanged: one rule per device, so that only one
# filter is ever made for the speakers.  It is for the J700 only.
override.node.software-dsp.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ700,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j700/graph-xlim.json"
                hide-parent = true
            }
        }
    }
    {
        matches = [
            { api.alsa.path = "hw:AppleJ700AOP,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/asahi-audio/j700/mic.json"
                hide-parent = true
            }
        }
    }
]
