# MacBook Neo (J700): the always-on low-power microphone as a PipeWire source,
# for developers only. Nothing loads this file by default.
#
# The low-power microphone is PCM 0 of the AOP card (hw:AppleJ700AOP,0): two
# channels of S32LE at 16 kHz in fixed 200 ms periods (3200 frames, two to
# four periods per buffer). It is meant for always-on, low-power experiments
# such as wake-word detection. Users get the microphone array ("MacBook Neo
# J700 Microphone"), which sounds much better; this source never becomes the
# default while that one exists.
#
# Enable it for one user:
#
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   ln -s /usr/share/asahi-audio/j700/lpmic-developer.conf \
#         ~/.config/pipewire/pipewire.conf.d/50-j700-lpmic-developer.conf
#   systemctl --user restart pipewire wireplumber
#
# Disable it again by removing the link and restarting the same services.

context.objects = [
    {
        factory = adapter
        args = {
            factory.name = api.alsa.pcm.source
            api.alsa.path = "hw:AppleJ700AOP,0"
            api.alsa.period-size = 3200
            node.name = "alsa_input.j700-lpmic-developer"
            node.description = "Aurora Low-Power Microphone (developer)"
            node.nick = "LPMic"
            media.class = "Audio/Source"
            audio.format = "S32LE"
            audio.rate = 16000
            audio.channels = 2
            audio.position = [ FL FR ]
            priority.session = 1
            priority.driver = 1
            device.icon-name = "audio-input-microphone"
        }
    }
]
